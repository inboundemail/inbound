name: Publish inboundctl

on:
  push:
    branches: [main]
    paths:
      - "packages/inboundctl/package.json"
  workflow_dispatch:

concurrency:
  group: publish-inboundctl
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install application dependencies
        run: bun install --frozen-lockfile

      - name: Install CLI dependencies
        working-directory: packages/inboundctl
        run: bun install --frozen-lockfile

      - name: Test CLI
        working-directory: packages/inboundctl
        run: bun run test

      - name: Typecheck CLI
        working-directory: packages/inboundctl
        run: bun run typecheck

      - name: Build CLI
        working-directory: packages/inboundctl
        run: bun run build

      - name: Smoke test CLI
        working-directory: packages/inboundctl
        run: node dist/inboundctl.js help

      - name: Read CLI version
        id: version
        working-directory: packages/inboundctl
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Check published version
        id: published
        env:
          CLI_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if bun info "inboundctl@$CLI_VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish CLI
        if: steps.published.outputs.exists != 'true'
        working-directory: packages/inboundctl
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.INBOUND_NPM_TOKEN || secrets.NPM_TOKEN }}
